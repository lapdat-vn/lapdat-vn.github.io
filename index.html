<style>
:root{--ink:#222222;--muted:#6B6B6B;--brand:#A50034;--line:#e4e4e4;--soft:#f6f6f6;color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#fff;color:var(--ink);font:15px/1.45 "LG Smart","LG Smart_Global","Noto Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.bar{border-top:3px solid var(--brand);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top)}
.bar div,main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.bar div{height:56px;display:flex;align-items:center}
.lg{height:34px;width:auto;display:block;margin:6px 0}
header{text-align:center;padding:32px 0 20px}
header h1{margin:0;font-size:24px;font-weight:700;color:var(--ink)}
header p{margin:8px 0 0;color:var(--muted);font-size:14px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
a{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px;padding:14px 18px;border:1.5px solid var(--line);border-radius:14px;color:inherit;text-decoration:none;background:#fff}
a:hover,a:focus-visible{border-color:var(--brand)}
a:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.t{display:flex;flex-direction:column;gap:2px}
.t b{font-size:18px}
.t small{font-size:14px;color:var(--muted)}
.ar{font-size:28px;line-height:1;color:var(--brand)}
.note{margin:18px 0 0;font-size:13px;color:var(--muted);text-align:center}
footer{margin-top:40px;padding:16px 0 calc(28px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;justify-content:center}
footer .lg{height:30px}
</style>
</head>
